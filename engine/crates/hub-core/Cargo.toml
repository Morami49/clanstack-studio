[package]
name = "hub-core"
description = "The hub's logic without any provider: accept, verify, order and serve events; import Studio Web events as signed facts. Runs native, on Cloudflare (wasm) and on any node."
version.workspace = true
edition.workspace = true

[dependencies]
foundation-core = { path = "../foundation-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
