# Branch cleanup (Q94, D-133): a human-approved action with an audit trail.
# Runs only when a person starts it (Actions → Branch cleanup → Run workflow), so the approval is the click.
#   preview  lists what would go and changes nothing (default)
#   delete   deletes branches named b-* whose every commit is already on main ("Ahead 0")
# main, Dependabot branches and any branch with unmerged work are never touched.
#
# Approval policy (D-133, D-137, Q101 A): Studio's setting SET-policy-branch-cleanup is the source of truth,
# read from the hub (scripts/policy.py). The repository variable POLICY_BRANCH_CLEANUP is the fallback when the
# hub can't answer, and any difference is flagged as drift. Values:
#   ask  (or unset)  runs only when a person starts it                       ← default
#   auto             also runs in delete mode after every push to main (merged branches are restorable, P-12)
#   off              never runs, not even when started by hand
# F-61: a preview run is named "(preview)" and warns that nothing was deleted, so it can't be mistaken for a cleanup.
# The run log and summary record who ran it, when, and each branch with the commit it pointed at,
# so any branch can be restored from that sha (GitHub → Branches → Restore, or `git push origin <sha>:refs/heads/<name>`).
name: Branch cleanup
run-name: Branch cleanup (${{ github.event_name == 'push' && 'delete, automatic' || inputs.mode }})
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (change nothing) or delete"
        type: choice
        options: [preview, delete]
        default: preview
permissions:
  contents: write
  pull-requests: read   # to skip branches that open PRs are based on (17 Nov: #20 lost its base)
concurrency: branch-cleanup
jobs:
  cleanup:
    # every push starts the job so drift is always checked; the policy step decides whether anything happens
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'push' && 'delete' || inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve the policy (Studio first, Q101 A)
        id: pol
        env:
          HUB_URL: https://clanstack-hub.ndab-utube.workers.dev
          HUB_TOKEN: ${{ secrets.HUB_WRITE_TOKEN }}
          PLATFORM: ${{ vars.POLICY_BRANCH_CLEANUP }}
        run: |
          python3 scripts/policy.py SET-policy-branch-cleanup --platform "$PLATFORM" --default ask
      - name: Decide
        id: go
        env: {EFFECTIVE: "${{ steps.pol.outputs.effective }}", EVENT: "${{ github.event_name }}"}
        run: |
          if [ "$EFFECTIVE" = off ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Policy is off: nothing runs." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = push ] && [ "$EFFECTIVE" != auto ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Policy is $EFFECTIVE: automatic cleanup skipped." >> "$GITHUB_STEP_SUMMARY"
          else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Find merged b-* branches
        if: steps.go.outputs.run == 'yes'
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          # a branch that an open PR targets is never deleted: GitHub closes such PRs instead of retargeting them
          gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --paginate --jq '.[].base.ref' | sort -u > bases.txt || { echo "::error::could not list open PRs; deleting nothing"; exit 1; }
          : > merged.txt; : > kept.txt
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/b-*'); do
            case "$ref" in main|dependabot/*) continue;; esac
            if grep -qxF "$ref" bases.txt; then echo "$ref" >> kept.txt; continue; fi
            if git merge-base --is-ancestor "origin/$ref" origin/main; then
              echo "$ref $(git rev-parse --short "origin/$ref")" >> merged.txt
            fi
          done
          {
            echo "### Branch cleanup — mode: $MODE, started by @${{ github.actor }} (${{ github.event_name }}), policy: ${{ steps.pol.outputs.effective }}"
            echo "main = $(git rev-parse --short origin/main)"
            if [ "$MODE" = preview ]; then
              echo
              echo "> **Preview only — nothing was deleted.** To delete these, choose Run workflow again and set mode to **delete**."
            fi
            echo
            echo "| branch | last commit (restore point) |"
            echo "|---|---|"
            while read -r b sha; do echo "| $b | $sha |"; done < merged.txt
            echo
            echo "$(wc -l < merged.txt) merged branch(es) found."
            if [ -s kept.txt ]; then echo; echo "Kept because an open pull request is based on them: $(paste -sd, kept.txt)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat merged.txt
          if [ "$MODE" = preview ]; then echo "::warning title=Preview only::Nothing was deleted. Run again with mode = delete to remove the $(wc -l < merged.txt) branch(es) listed."; fi
      - name: Delete them
        if: steps.go.outputs.run == 'yes' && env.MODE == 'delete'
        run: |
          while read -r b sha; do
            git push origin --delete "$b" && echo "deleted $b (was $sha)"
          done < merged.txt
          echo "Deleted $(wc -l < merged.txt) branch(es)." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the run in Studio (P-13)
        # a push with nothing to delete leaves no record; every person-started run and every failure does
        if: always() && steps.go.outputs.run == 'yes'
        env:
          HUB_URL: https://clanstack-hub.ndab-utube.workers.dev
          HUB_TOKEN: ${{ secrets.HUB_WRITE_TOKEN }}
          STATUS: ${{ job.status }}
          POLICY: ${{ steps.pol.outputs.effective }}
        run: |
          n=$(wc -l < merged.txt 2>/dev/null || echo 0)
          list=$(awk '{printf "%s%s@%s", (NR>1?",":""), $1, $2}' merged.txt 2>/dev/null)
          if [ "$STATUS" = success ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$n" = 0 ]; then echo "nothing to record"; exit 0; fi
          case "$MODE" in
            delete)  text="Deleted $n merged branch(es)${list:+: $list}." ; undo="Restore any branch from its sha: GitHub → Branches → Restore, or git push origin <sha>:refs/heads/<name>." ;;
            *)       text="Preview: $n merged branch(es) would be deleted${list:+: $list}. Nothing changed." ; undo="" ;;
          esac
          [ "$STATUS" = success ] || text="Run $STATUS. $text"
          outcome=$([ "$STATUS" = success ] && echo success || echo failure)
          python3 scripts/run_record.py branch-cleanup --title "Branch cleanup runs" --outcome "$outcome" \
            --text "$text" --policy "$POLICY" --undo "$undo" --field "mode=$MODE" --field "branches=$n"
