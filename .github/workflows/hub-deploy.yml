name: hub-deploy
# H1 (D-089): after ci passes on main, deploy the hub to Cloudflare and import Studio Web's exported events (D-095 stage A).
# Owner setup (GitHub → Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   Cloudflare token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard (Workers & Pages → right-hand side)
#   HUB_WRITE_TOKEN        a long random string (password manager); required for /push and /import
#   HUB_READ_TOKEN         optional: a second random string for read-only nodes/surfaces
# IMPORTER_SEED (the key that signs imported Studio events) is generated by CI on first deploy and
# lives only in Cloudflare: nobody sees it. Losing it just means a new importer identity.
# Until CLOUDFLARE_API_TOKEN exists this job skips.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions: {contents: read}
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hub}}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is set up
        id: ready
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflare not set up yet (Q57): skipping."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/checkout@v7
        with: {ref: "${{ github.event.workflow_run.head_sha }}"}
      - if: steps.ready.outputs.go == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with: {targets: wasm32-unknown-unknown}
      - if: steps.ready.outputs.go == 'yes'
        name: Deploy
        id: deploy
        run: |
          npx -y wrangler@4.158.0 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> $GITHUB_OUTPUT
      - if: steps.ready.outputs.go == 'yes'
        name: Set hub secrets (only when provided)
        env: {HUB_WRITE_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}", HUB_READ_TOKEN: "${{ secrets.HUB_READ_TOKEN }}"}
        run: |
          [ -n "$HUB_WRITE_TOKEN" ] && printf '%s' "$HUB_WRITE_TOKEN" | npx -y wrangler@4.158.0 secret put HUB_WRITE_TOKEN || true
          [ -n "$HUB_READ_TOKEN" ] && printf '%s' "$HUB_READ_TOKEN" | npx -y wrangler@4.158.0 secret put HUB_READ_TOKEN || true
          if ! npx -y wrangler@4.158.0 secret list | grep -q IMPORTER_SEED; then
            openssl rand -hex 32 | npx -y wrangler@4.158.0 secret put IMPORTER_SEED
          fi
      - if: steps.ready.outputs.go == 'yes'
        name: Check health and import Studio Web's export
        env: {URL: "${{ steps.deploy.outputs.url }}", HUB_WRITE_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}"}
        run: |
          # F-28: a first deploy's workers.dev address can take a minute to go live; wait up to ~3 min.
          for i in $(seq 1 18); do curl -fsS "$URL/health" && break; echo "not live yet ($i/18)"; sleep 10; done; echo
          curl -fsS "$URL/health"; echo
          if [ -f ../exports/studio-events.json ] && [ -n "$HUB_WRITE_TOKEN" ]; then
            curl -fsS -X POST -H "authorization: Bearer $HUB_WRITE_TOKEN" "$URL/import" --data-binary @../exports/studio-events.json; echo
          fi
          [ -n "$HUB_WRITE_TOKEN" ] && curl -fsS -H "authorization: Bearer $HUB_WRITE_TOKEN" "$URL/status"; echo
