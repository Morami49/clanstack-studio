name: mirror
# D-096 + Q67 B: after ci passes on main, push the tested commit to GitLab with a deploy key
# owned by the GitLab project (not a person, D-111). Never force-pushes.
# Setup (owner): GitHub → Settings → Secrets and variables → Actions
#   secret   GITLAB_DEPLOY_KEY = private half of the deploy key (the file without .pub)
#   variable GITLAB_REPO       = clanstack/clanstack-studio
# Until both exist this job skips.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions: {contents: read}
jobs:
  gitlab:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: "${{ github.event.workflow_run.head_sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Push the tested commit to GitLab main
        env:
          KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
          REPO: ${{ vars.GITLAB_REPO }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$KEY" ] || [ -z "$REPO" ]; then echo "GitLab mirror not set up yet (W4): skipping."; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          # Pin GitLab's published ED25519 host key fingerprint (docs.gitlab.com/user/gitlab_com).
          ssh-keyscan -t ed25519 gitlab.com 2>/dev/null > ~/.ssh/known_hosts
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          [ "$fp" = "SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8" ] || { echo "gitlab.com host key mismatch: $fp"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git push "git@gitlab.com:${REPO}.git" "${SHA}:refs/heads/main"
          echo "Mirrored ${SHA:0:7} to gitlab.com/${REPO}"
          rm -f ~/.ssh/mirror
      - name: Record the run in Studio (P-13)
        if: always()
        env:
          HUB_URL: https://clanstack-hub.ndab-utube.workers.dev
          HUB_TOKEN: ${{ secrets.HUB_WRITE_TOKEN }}
          STATUS: ${{ job.status }}
          REPO: ${{ vars.GITLAB_REPO }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [ -n "$REPO" ] || exit 0
          if [ "$STATUS" = success ]; then text="Mirrored ${RUN_SHA:0:7} to gitlab.com/$REPO (never force-pushed)."; o=success
          else text="Mirror of ${RUN_SHA:0:7} to gitlab.com/$REPO $STATUS."; o=failure; fi
          python3 scripts/run_record.py gitlab-mirror --title "GitLab mirror runs" --outcome "$o" --text "$text" \
            --undo "Nothing to undo: the mirror only adds commits GitHub already has." --field "target=gitlab.com/$REPO"
