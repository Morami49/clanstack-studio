name: automerge
# AS2 3e (19 Nov): a pull request whose every changed file is low risk (scripts/risk_class.py) merges itself once
# its required checks and the staging deploy have passed. Anything touching workflows, hub or engine code, sign-in,
# secrets, the watch baseline or legal pages waits for Nowed. A merge made with GITHUB_TOKEN doesn't start other
# workflows, so this job starts the production deploy itself, for the same tree that passed CI.
# Hold (F-automerge-overrode-hold, 19 Nov): a draft PR, a PR labelled "hold", or one whose body contains <!-- hold -->
# never merges itself; scripts/should_automerge.py decides and the log says why.
# Staged (F-staging-one-branch): hub-staging deploys a train of several PRs and uploads its list (artifact
# "staging-train"). A PR counts as staged when its current head SHA is in the list of a successful hub-staging run;
# runs without the list (Cloudflare not set up yet) count only their own head SHA, as before.
on:
  workflow_run:
    workflows: [hub-staging]
    types: [completed]
permissions: {contents: write, pull-requests: write, actions: write, checks: read}
concurrency: automerge
jobs:
  merge-low-risk:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Which heads did this staging run include
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", R: "${{ github.repository }}", RUN: "${{ github.event.workflow_run.id }}", SHA: "${{ github.event.workflow_run.head_sha }}"}
        run: |
          if gh run download "$RUN" -R "$R" -n staging-train -D "$RUNNER_TEMP/st" 2>/dev/null && [ -s "$RUNNER_TEMP/st/train.json" ]; then
            jq -r '.included[].sha' "$RUNNER_TEMP/st/train.json" > staged.txt
            echo "staging run $RUN ($(jq -r .mode "$RUNNER_TEMP/st/train.json")) included: $(tr '\n' ' ' < staged.txt)"
          else
            echo "no staging-train list on run $RUN: only its own head $SHA counts as staged"
            echo "$SHA" > staged.txt
          fi
      - name: Classify, check hold, merge, deploy
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", R: "${{ github.repository }}", RUN: "${{ github.event.workflow_run.id }}"}
        run: |
          last=""; merged_prs=""
          for sha in $(cat staged.txt); do
            nums=$(gh api "repos/$R/commits/$sha/pulls" --jq ".[] | select(.state==\"open\" and .base.ref==\"main\" and .head.sha==\"$sha\" and .head.repo.full_name==\"$R\") | .number") || nums=""
            [ -n "$nums" ] || { echo "$sha: no open PR has it as its head (merged, moved on or not a PR): nothing to do"; continue; }
            for N in $nums; do
              gh api "repos/$R/pulls/$N" > pr.json
              gh api "repos/$R/pulls/$N/files" --paginate --jq '.[].filename' > files.txt
              verdict=$(python3 scripts/risk_class.py < files.txt)
              gh api "repos/$R/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | {name, conclusion}]' > checks.json
              decision=$(jq -n --arg v "$verdict" --slurpfile pr pr.json --slurpfile c checks.json \
                '{verdict: $v, labels: $pr[0].labels, draft: $pr[0].draft, body: $pr[0].body, checks: $c[0]}' | python3 scripts/should_automerge.py)
              echo "PR #$N at $sha: $decision"
              case "$decision" in merge:*) ;; *) continue ;; esac
              merged=$(gh api -X PUT "repos/$R/pulls/$N/merge" -f merge_method=merge -f sha="$sha" \
                -f commit_title="Merge pull request #$N (auto: low risk, CI and staging passed)" --jq .sha) \
                || { echo "PR #$N: GitHub refused the merge (head moved or conflicts with main now): left for later"; continue; }
              echo "merged #$N as $merged"
              gh api "repos/$R/issues/$N/comments" -f body="Auto-merged under AS2 3e: every changed file is low risk, nothing holds it, required checks passed on $sha and it was in staging run $GITHUB_SERVER_URL/$R/actions/runs/$RUN. Production deploy follows for the latest merge." >/dev/null
              last=$merged; merged_prs="$merged_prs #$N"
            done
          done
          if [ -n "$last" ]; then
            gh api -X POST "repos/$R/actions/workflows/hub-deploy.yml/dispatches" -f ref=main -f "inputs[sha]=$last"
            echo "production deploy started for $last (merged:$merged_prs)"
          else
            echo "nothing merged"
          fi
