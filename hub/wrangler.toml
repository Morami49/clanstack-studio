name = "clanstack-hub"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
# Pinned: worker-build 0.9 (Nov 2026) refuses worker 0.8. Move both together, on a branch, through staging.
command = "cargo install -q worker-build@^0.8 && worker-build --release"

[[durable_objects.bindings]]
name = "RECORD"
class_name = "Record"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Record"]

[vars]
# GitHub logins allowed to sign in to the Claude connector (owner-only at first, F-44). Comma-separated.
ALLOWED_GITHUB_LOGINS = "Morami49"
# "production" or "staging": Studio shows a staging ribbon and a reload banner by build (D-172 release rules)
NODACH_ENV = "production"
# I1, Q53 A: the Claude connector may read its signed-in owner's Private tier ("on" or "off"). Sealed items never.
CONNECTOR_PRIVATE_READ = "on"

# Secrets (set with `wrangler secret put`, never in this file):
#   HUB_WRITE_TOKEN  bearer token required for /push and /import
#   IMPORTER_SEED    64 hex chars: the importer key that signs Studio Web events (key register: Q52)
#   GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET  GitHub OAuth App used for connector sign-in (D-128)
#   CONNECTOR_SEED   64 hex chars: signs writes made through the Claude connector (generated by CI)
#   PRIVATE_SEED     64 hex chars: wraps each owner's Private-tier data keys (I1, envelope). Generated by CI once.
#                    To rotate: set the old value as PRIVATE_SEED_PREVIOUS first, then a new PRIVATE_SEED; keys are
#                    re-wrapped on next use. Losing both makes private items unreadable: back up with /studio/api/private/export.

# Staging hub (Q24 B, Q26 C): the same code with its own Durable Object, so its own empty test record.
# Every branch that passes CI is deployed here (.github/workflows/hub-staging.yml); main goes to production.
# Bindings, migrations and vars don't inherit between environments in Wrangler, so they are repeated here.
[env.staging]
name = "clanstack-hub-staging"

[[env.staging.durable_objects.bindings]]
name = "RECORD"
class_name = "Record"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Record"]

[env.staging.vars]
ALLOWED_GITHUB_LOGINS = "Morami49"
NODACH_ENV = "staging"
CONNECTOR_PRIVATE_READ = "on"
