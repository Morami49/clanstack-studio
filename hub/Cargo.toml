[package]
name = "clanstack-hub"
description = "H1 of the free ladder (D-089): hub-core on Cloudflare Workers + a SQLite-backed Durable Object."
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib"]

[dependencies]
hub-core = { path = "../engine/crates/hub-core" }
foundation-core = { path = "../engine/crates/foundation-core" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
