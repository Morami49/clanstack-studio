<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Sign in · Nodach Studio</title>
<style>body{font:16px system-ui;max-width:26rem;margin:3rem auto;padding:0 1rem;color:#222}h1{font-size:1.4rem}
a.b,button{display:block;width:100%;box-sizing:border-box;margin:.5rem 0;padding:.7rem;border:1px solid #ccc;border-radius:8px;background:#fff;font:inherit;text-align:center;text-decoration:none;color:inherit;cursor:pointer}
input{width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #ccc;border-radius:8px;font:inherit}.note{color:#666;font-size:13px}hr{border:0;border-top:1px solid #eee;margin:1.2rem 0}</style></head>
<body><h1>Sign in to Nodach Studio</h1>
<a class=b href="/studio/login/google">Continue with Google</a>
<a class=b href="/studio/login/github">Continue with GitHub</a>
<hr>
<form method=post action="/studio/login/email"><label>Or get a sign-in link by email<br><input type=email name=email required autocomplete=email placeholder="you@company.com"></label>
<button type=submit>Email me a link</button></form>
<p class=note>Google and email sign-in are for people who've been invited. The same email address gives you the same account
either way. Nodach stores only a fingerprint (hash) of your address, never the address itself.</p>
</body></html>
